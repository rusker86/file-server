<!DOCTYPE html>
<html lang="en">
  <head>
    <title>File Server</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="css/styles.css">
    <script type="module" src="js/main.js"></script>
  </head>

  <body>
    <main class="container">
      <header>
        <h1>File Server</h1>

        <button
          id="menu-toggle"
          class="menu-toggle"
          type="button"
          aria-label="Open actions menu"
          aria-expanded="false"
          aria-controls="header-actions"
        >
          <span></span>
          <span></span>
          <span></span>
        </button>

        <div id="header-actions" class="controls">
          <button id="new-folder" type="button">📁 New folder</button>
          <button id="upload" type="button">⬆️ Upload</button>
          <button id="delete" type="button" class="danger" disabled>🗑️ Delete</button>
          <button id="theme-toggle" type="button" title="Toggle theme"></button>
          <button id="logout" type="button">Sign out</button>
        </div>
      </header>

      <div class="toolbar">
        <button id="back" type="button" disabled>← Back</button>
        <span id="current-path" class="current-path">/</span>
      </div>

      <ul class="files"></ul>
      <p id="empty-state" class="empty-state" role="status" hidden>No hay archivos.</p>

      <input id="file-input" type="file" multiple hidden>
    </main>

    <!-- Right-click menu -->
    <div id="context-menu" class="context-menu hidden" role="menu">
      <button type="button" class="context-menu-item" role="menuitem" data-action="new-folder">
        <span class="context-menu-icon">📁</span>
        <span class="context-menu-label">New folder</span>
      </button>

      <div class="context-menu-separator" role="separator"></div>

      <button type="button" class="context-menu-item danger" role="menuitem" data-action="delete">
        <span class="context-menu-icon">🗑️</span>
        <span class="context-menu-label">Delete</span>
      </button>
    </div>

    <!-- New folder modal -->
    <div id="folder-modal" class="modal hidden">
      <div class="modal-content">
        <div class="modal-header">
          <h2>New folder</h2>
          <button id="close-folder" type="button" class="close-button">×</button>
        </div>

        <form id="folder-form">
          <input
            id="folder-name"
            type="text"
            placeholder="Folder name"
            autocomplete="off"
            required
          >

          <div class="modal-actions">
            <button type="button" id="cancel-folder">Cancel</button>
            <button type="submit" class="primary">Create</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Delete confirmation modal -->
    <div id="delete-modal" class="modal hidden">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Delete files</h2>
          <button id="close-delete" type="button" class="close-button">×</button>
        </div>

        <p id="delete-message"></p>

        <ul id="delete-list" class="item-list"></ul>

        <div class="modal-actions">
          <button type="button" id="cancel-delete">Cancel</button>
          <button type="button" id="confirm-delete" class="danger-solid">Delete</button>
        </div>
      </div>
    </div>

    <!-- Upload files modal -->
    <div id="upload-modal" class="modal hidden">
      <div class="modal-content upload-modal-content" role="dialog" aria-modal="true" aria-labelledby="upload-title">
        <div class="modal-header">
          <h2 id="upload-title">Upload files</h2>
          <button id="close-upload" type="button" class="close-button" aria-label="Close">×</button>
        </div>

        <button id="upload-dropzone" type="button" class="upload-dropzone">
          <span class="upload-drop-icon" aria-hidden="true">⬆</span>
          <span class="upload-drop-title">Drop files here</span>
          <span class="upload-drop-hint">or click to browse</span>
        </button>

        <ul id="upload-file-list" class="item-list upload-file-list" hidden></ul>

        <div class="modal-actions">
          <button type="button" id="cancel-upload">Cancel</button>
          <button type="button" id="start-upload" class="primary" disabled>Upload</button>
        </div>
      </div>
    </div>

    <div id="toast-container"></div>
  </body>
</html>
