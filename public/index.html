<!DOCTYPE html>
<html>
    <head>
        <title>File Server</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <link rel="stylesheet" href="styles.css">
    </head>

    <body>
        <main class="container">

            <header>
                <h1>File Server</h1>

                <div class="controls">
                  <button id="new-folder">📁 New folder</button>
                  <button id="upload">⬆️ Upload</button>
                  <button id="theme">🌙</button>
                </div>
            </header>

            <button id="back">← Back</button>

            <ul class="files"></ul>

        </main>

        <!-- Upload modal -->
        <div id="upload-modal" class="modal hidden">
            <div class="modal-content">

                <div class="modal-header">
                    <h2>Upload files</h2>
                    <button id="close-upload" class="close-button">×</button>
                </div>

                <div id="drop-zone" class="drop-zone">
                    <div class="drop-icon">📁</div>

                    <p>
                        Drag and drop files here
                    </p>

                    <span>or click to select files</span>

                    <input
                        id="file-input"
                        type="file"
                        multiple
                        hidden
                    >
                </div>

                <ul id="upload-list" class="upload-list"></ul>

                <div class="modal-actions">
                    <button id="cancel-upload">Cancel</button>
                    <button id="start-upload" class="primary">
                        Upload
                    </button>
                </div>

            </div>
        </div>

        <div id="folder-modal" class="modal hidden">
          <div class="modal-content">
            <div class="modal-header">
              <h2>New folder</h2>
              <button id="close-folder" class="close-button">×</button>
            </div>

            <form id="folder-form">
              <input
                id="folder-name"
                type="text"
                placeholder="Folder name"
                autocomplete="off"
                required
              >

              <div class="modal-actions">
                <button type="button" id="cancel-folder">
                  Cancel
                </button>

                <button type="submit" class="primary">
                  Create
                </button>
              </div>
            </form>
          </div>
        </div>

        <div id="toast-container"></div>

        <script src="main.js"></script>
    </body>
</html>
